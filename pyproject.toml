[project]
name = "vox-personalis"
version = "0.1.0"
description = "VOX Personalis - Personalized speech recognition engineering project"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
    "webrtcvad-wheels>=2.0.12",
    "tqdm>=4.65.0",
    "openai-whisper>=20231117",
    "jiwer>=3.0",
    "torch>=2.0",
    "scipy>=1.10",
    "peft>=0.4.0",
    "sherpa-onnx>=1.13.0",
    "huggingface-hub>=0.20",
    "aiohttp>=3.9",
    "sounddevice>=0.4",
    "silero-vad>=6.0",
    "lhotse>=1.20",
]

[project.optional-dependencies]
serving = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.8.0",
    "mdformat>=0.7.17",
    "mdformat-gfm>=0.3.5",  # GitHub Flavored Markdown support
    "mdformat-tables>=0.4.1",  # Table formatting
    "pymarkdownlnt>=0.9.0",
    "shellcheck-py>=0.9.0",  # ShellCheck linter wrapper
    "shfmt-py>=0.1.0",  # shfmt formatter wrapper
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["baseline_eval*", "data_inventory*", "dataset_versioning*", "feedback_finetune*", "fine_tuning*", "error_analysis*", "serving*", "vox_daemon*", "zipformer_eval*", "zipformer_finetune*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Set to true for stricter checking
mypy_path = "scripts"
namespace_packages = false

# HuggingFace libraries do not ship type stubs or py.typed markers
# See: https://github.com/huggingface/transformers/issues/14833
[[tool.mypy.overrides]]
module = ["datasets", "transformers", "transformers.*", "peft", "peft.*", "scipy", "scipy.*"]
ignore_missing_imports = true
follow_untyped_imports = false

# S2 inference and data libs — no type stubs available
[[tool.mypy.overrides]]
module = ["sherpa_onnx", "soundfile", "librosa", "pandas", "lhotse", "lhotse.*"]
ignore_missing_imports = true

# Cross-package imports within scripts/ — mypy_path="scripts" causes false negatives
[[tool.mypy.overrides]]
module = ["scripts.*"]
ignore_missing_imports = true

[tool.mdformat]
wrap = "keep"  # Preserve existing line wrapping
number = true  # Use sequential numbering for ordered lists (1., 2., 3.)
